# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75))
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm -> 42 người/nhóm, tổng 84 > 40: KHÔNG đủ người
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = 20 / 0,02 = 1.000 < 1.251: KHÔNG đạt cho mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300 < 1.251: KHÔNG đạt (loại vì số cụm < 20)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE 6,96, n hiệu dụng = 859)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm song song cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo staff_id và log telemetry lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 6 điểm, 3 luật dừng và ngày chốt quyết định viết trước khi pilot bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm, đạt điều kiện tối thiểu 20 cụm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Do giới hạn 40 nhân viên (20 cụm/nhóm), không cách chia theo cụm nào đủ mẫu để phát hiện mức chênh 5 điểm với power 0,80. Nhóm chấp nhận thiết kế cho mức chênh 6 điểm (MDE = 0,06; n_per_arm = 859; m >= 299 yêu cầu/nhân viên). Nếu tác động thực tế của trợ lý chỉ là 5 điểm thì Power giảm còn khoảng 0,64 (thay vì 0,80). Giám đốc vận hành ký duyệt chấp nhận đánh đổi này.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ mở lại hiện tại toàn bộ: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97% (39/982). Ngưỡng an toàn đã chọn: cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần tuyệt đối 6% (không đặt ngưỡng cố định 3% vì sẽ làm pilot bị dừng oan ngay tuần đầu).

